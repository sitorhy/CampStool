<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>毛玻璃顶部栏菜单导航栏设计</title>
    <style>
        /* 模拟底层发光/动漫背景 */
        body {
            margin: 0;
            padding: 0;
            min-height: 200vh; /* 设为高页面以测试滚动吸顶效果 */
            background: linear-gradient(135deg, #1a1c2e 0%, #3a1c38 50%, #0f172a 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 页面示例内容面板 */
        .content-container {
            padding: 120px 40px 40px 40px;
            color: rgba(255, 255, 255, 0.85);
            text-align: center;
        }

        /* ================= 毛玻璃 Navbar 样式规范 ================= */

        /* 1. 顶部栏固定容器 */
        .glass-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;

            /* 核心毛玻璃效果 */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        /* 2. 左侧 Logo 标志区 */
        .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
        }

        /* 3. 中间导航菜单 (Nav Links) */
        .header-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.3);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-item {
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .nav-item:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
        }

        /* 激活状态：蓝宝石发光背景 */
        .nav-item.active {
            color: #ffffff;
            font-weight: 600;
            background: rgba(59, 130, 246, 0.65);
            border: 1px solid rgba(147, 197, 253, 0.8);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
        }

        /* 4. 右侧操作区 (搜索、通知、头像) */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* 搜索框 */
        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 140px;
            height: 34px;
            padding: 0 12px 0 32px;
            font-size: 13px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            outline: none;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-input:focus {
            width: 200px; /* 聚焦展开变长 */
            background: rgba(255, 255, 255, 0.28);
            border-color: #60a5fa;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.6);
        }

        .search-icon {
            position: absolute;
            left: 10px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
        }

        /* 图标按钮 (如通知/设置) */
        .action-icon-btn {
            position: relative;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .action-icon-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            border-color: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* 小红点提醒 */
        .badge {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 6px #ef4444;
        }

        /* 用户头像 */
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #60a5fa;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
            transition: transform 0.25s ease;
        }

        .user-avatar:hover {
            transform: scale(1.08);
        }
    </style>
</head>
<body>

<!-- 顶部栏菜单组组件 -->
<header class="glass-header">

    <!-- 1. Logo 品牌区 -->
    <a href="#" class="header-logo">
        <div class="logo-icon">▲</div>
        <span>AnimeUI</span>
    </a>

    <!-- 2. 中间导航标签页 -->
    <nav class="header-nav">
        <a href="#" class="nav-item active">首页</a>
        <a href="#" class="nav-item">角色画廊</a>
        <a href="#" class="nav-item">组件库</a>
        <a href="#" class="nav-item">关于项目</a>
    </nav>

    <!-- 3. 右侧工具栏 -->
    <div class="header-actions">
        <!-- 搜索框 -->
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="搜索组件...">
        </div>

        <!-- 消息通知 -->
        <div class="action-icon-btn" title="通知">
            🔔
            <span class="badge"></span>
        </div>

        <!-- 用户头像 -->
        <div class="user-avatar" title="个人中心"></div>
    </div>

</header>

<!-- 页面主体内容示意 -->
<div class="content-container">
    <h2>向下滚动页面可查看顶部栏固定吸顶效果</h2>
    <p>毛玻璃模糊效果（Backdrop Filter）能够自动将下方滚过的图像进行优雅地模糊透光处理。</p>
</div>

</body>
</html>

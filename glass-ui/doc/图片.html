<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>毛玻璃 Image 包装组件设计</title>
    <style>
        /* 模拟底层发光/动漫背景 */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            background: linear-gradient(135deg, #1a1c2e 0%, #3a1c38 50%, #0f172a 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* ================= 毛玻璃 Image 包装组件核心规范 ================= */

        /* 1. 外层外壳容器 */
        .glass-image-wrapper {
            position: relative;
            width: 300px;
            height: 200px;
            border-radius: 18px;
            overflow: hidden; /* 裁剪放大的图片与遮罩 */

            /* 毛玻璃边框与浮空投影 */
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);

            cursor: pointer;
            user-select: none;
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 悬停时整个组件上浮并增加深色发光 */
        .glass-image-wrapper:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(96, 165, 250, 0.4);
        }

        /* 2. 真实图片元素 */
        .glass-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 保证宽高比充盈容器 */
            display: block;
            opacity: 0; /* 默认隐藏，加载完成后渐现 */
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 图片加载完成类 */
        .glass-image.loaded {
            opacity: 1;
        }

        /* 悬停时图片缓慢平滑放大 (Zoom Effect) */
        .glass-image-wrapper:hover .glass-image.loaded {
            transform: scale(1.1);
        }

        /* 3. 高光扫过动画 (Shine Effect) */
        .glass-image-wrapper::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -60%;
            width: 50%;
            height: 200%;
            background: linear-gradient(
                    60deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.25) 50%,
                    rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(25deg);
            pointer-events: none;
            transition: all 0.6s ease;
            opacity: 0;
        }

        .glass-image-wrapper:hover::after {
            left: 130%;
            opacity: 1;
        }

        /* 4. 加载中骨架屏与 Spinner (Placeholder / Loading) */
        .image-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(15, 23, 42, 0.4);
            z-index: 2;
            transition: opacity 0.4s ease;
        }

        /* 旋转加载圈 */
        .placeholder-spinner {
            width: 32px;
            height: 32px;
            border: 2.5px solid rgba(255, 255, 255, 0.2);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
        }

        /* 占位文字 */
        .placeholder-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.65);
            letter-spacing: 0.5px;
        }

        /* 5. 图片加载失败占位 (Error Fallback) */
        .image-error-fallback {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(20, 25, 40, 0.8);
            color: rgba(255, 255, 255, 0.7);
            z-index: 3;
        }

        .error-icon {
            font-size: 24px;
            opacity: 0.8;
        }

        .error-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* 6. 悬停渐变信息遮罩 (Caption Overlay) */
        .image-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px 16px 12px 16px;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.85) 0%, rgba(15, 23, 42, 0) 100%);
            z-index: 4;
            pointer-events: none;

            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .glass-image-wrapper:hover .image-caption {
            transform: translateY(0);
        }

        .caption-title {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 4px 0;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .caption-desc {
            color: rgba(255, 255, 255, 0.75);
            font-size: 12px;
            margin: 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<!-- 示例一：正常加载并带标题悬浮的 Image 组件 -->
<div class="glass-image-wrapper">
    <!-- 1. 加载占位 -->
    <div class="image-placeholder" id="placeholder1">
        <div class="placeholder-spinner"></div>
        <span class="placeholder-text">加载中...</span>
    </div>

    <!-- 2. 图片主体 -->
    <img
            src="https://picsum.photos/600/400?random=1"
            alt="壁纸"
            class="glass-image"
            onload="handleImageLoaded(this, 'placeholder1')"
    >

    <!-- 3. 悬浮底栏标题 -->
    <div class="image-caption">
        <h4 class="caption-title">星海晚霞 (Sunset Beach)</h4>
        <p class="caption-desc">尺寸: 1920x1080 • 动漫壁纸画廊</p>
    </div>
</div>

<!-- 示例二：模拟图片加载失败 (Fallback) 场景 -->
<div class="glass-image-wrapper">
    <div class="image-placeholder" id="placeholder2" style="display: none;">
        <div class="placeholder-spinner"></div>
    </div>

    <!-- 故意填写错误的图片地址以触发 error -->
    <img
            src="https://invalid-image-url-test.com/404.jpg"
            alt="失效图片"
            class="glass-image"
            onerror="handleImageError(this, 'placeholder2', 'errorBox2')"
    >

    <!-- 4. 失败退回卡片 -->
    <div class="image-error-fallback" id="errorBox2" style="display: none;">
        <span class="error-icon">🖼️</span>
        <span class="error-text">图片加载失败</span>
    </div>
</div>

<script>
    // 图片加载成功处理
    function handleImageLoaded(imgElement, placeholderId) {
        const placeholder = document.getElementById(placeholderId);
        if (placeholder) {
            placeholder.style.opacity = '0';
            setTimeout(() => placeholder.style.display = 'none', 400);
        }
        imgElement.classList.add('loaded');
    }

    // 图片加载失败处理
    function handleImageError(imgElement, placeholderId, errorBoxId) {
        const placeholder = document.getElementById(placeholderId);
        const errorBox = document.getElementById(errorBoxId);

        if (placeholder) placeholder.style.display = 'none';
        if (errorBox) errorBox.style.display = 'flex';
        imgElement.style.display = 'none';
    }
</script>

</body>
</html>

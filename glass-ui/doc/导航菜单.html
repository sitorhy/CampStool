<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>毛玻璃导航菜单设计</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
            background: linear-gradient(135deg, #1a1c2e 0%, #3a1c38 50%, #0f172a 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* ================= 毛玻璃导航菜单核心样式 ================= */

        .glass-nav-menu {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: rgba(15, 23, 42, 0.45); /* 提升文字层级对比度 */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            list-style: none;
            margin: 0;
        }

        /* 顶级菜单项 */
        .nav-menu-item {
            position: relative;
        }

        /* 顶级菜单链接按钮 */
        .nav-menu-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
            user-select: none;
        }

        /* 悬停态：背景升亮并带有微闪光 */
        .nav-menu-link:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
        }

        /* 选中/激活态：发光亮蓝 */
        .nav-menu-item.active .nav-menu-link {
            color: #ffffff;
            font-weight: 600;
            background: rgba(59, 130, 246, 0.65);
            border: 1px solid rgba(147, 197, 253, 0.8);
            box-shadow: 0 0 14px rgba(59, 130, 246, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }

        /* 含有二级菜单的箭头指示 */
        .dropdown-arrow {
            width: 6px;
            height: 6px;
            border-right: 1.5px solid currentColor;
            border-bottom: 1.5px solid currentColor;
            transform: rotate(45deg);
            transition: transform 0.25s ease;
            margin-left: 2px;
            margin-bottom: 2px;
        }

        .nav-menu-item:hover .dropdown-arrow {
            transform: rotate(-135deg);
            margin-bottom: -2px;
        }

        /* 二级下拉子菜单 (Submenu Dropdown) */
        .sub-menu {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 10px;
            min-width: 170px;
            padding: 8px;
            background: rgba(20, 25, 40, 0.75); /* 暗色半透明保证清晰度 */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 14px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
            list-style: none;

            /* 隐藏与显示动效 */
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px) scale(0.96);
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 100;
        }

        /* 悬停父级项时展开二级菜单 */
        .nav-menu-item:hover .sub-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        /* 二级菜单单项 */
        .sub-menu-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            font-size: 13.5px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        /* 二级菜单 Hover 效果：右平移动画 + 蓝色高亮 */
        .sub-menu-link:hover {
            color: #ffffff;
            background: rgba(59, 130, 246, 0.5);
            padding-left: 16px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        /* 徽标 Tag (例如：Hot / New) */
        .menu-tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.8);
            color: #fff;
            box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
        }
    </style>
</head>
<body>

<!-- 导航菜单组件 -->
<ul class="glass-nav-menu">

    <!-- 1. 首页 -->
    <li class="nav-menu-item active">
        <a href="#" class="nav-menu-link">
            <span>🏠 首页</span>
        </a>
    </li>

    <!-- 2. 下拉菜单项：组件库 -->
    <li class="nav-menu-item">
        <a href="#" class="nav-menu-link">
            <span>🧩 组件库</span>
            <div class="dropdown-arrow"></div>
        </a>
        <!-- 二级菜单 -->
        <ul class="sub-menu">
            <li><a href="#" class="sub-menu-link">按钮组 (Buttons)</a></li>
            <li><a href="#" class="sub-menu-link">下拉选择器 (Select)</a></li>
            <li><a href="#" class="sub-menu-link">标签页 (Tabs)</a></li>
            <li><a href="#" class="sub-menu-link">分页 (Pagination) <span class="menu-tag">NEW</span></a></li>
        </ul>
    </li>

    <!-- 3. 下拉菜单项：主题设置 -->
    <li class="nav-menu-item">
        <a href="#" class="nav-menu-link">
            <span>🎨 主题风格</span>
            <div class="dropdown-arrow"></div>
        </a>
        <ul class="sub-menu">
            <li><a href="#" class="sub-menu-link">Sunset Cafe 晚霞</a></li>
            <li><a href="#" class="sub-menu-link">Midnight 深蓝</a></li>
            <li><a href="#" class="sub-menu-link">Cyberpunk 赛博 <span class="menu-tag" style="background: rgba(245, 158, 11, 0.8); box-shadow: 0 0 6px rgba(245, 158, 11, 0.8);">HOT</span></a></li>
        </ul>
    </li>

    <!-- 4. 单链接：文档 -->
    <li class="nav-menu-item">
        <a href="#" class="nav-menu-link">
            <span>📖 设计规范</span>
        </a>
    </li>

</ul>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>毛玻璃 Divider 分割线组件设计</title>
    <style>
        /* 模拟底层发光动漫背景 */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1c2e 0%, #3a1c38 50%, #0f172a 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 440px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-text {
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            margin: 0;
        }

        /* ================= 毛玻璃 Divider 核心规范 ================= */

        /* 1. 基础横向渐变发光分割线 */
        .glass-divider {
            width: 100%;
            height: 1.5px;
            border: none;
            margin: 12px 0;
            /* 两端淡出、中间亮白的霓虹渐变 */
            background: linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.6) 20%,
                    #60a5fa 50%,
                    rgba(255, 255, 255, 0.6) 80%,
                    rgba(255, 255, 255, 0) 100%
            );
            box-shadow: 0 0 8px rgba(96, 165, 250, 0.6);
        }

        /* 2. 带文字/图标的分割线容器 */
        .glass-divider-with-text {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 12px 0;
            color: rgba(255, 255, 255, 0.65);
            font-size: 13px;
            font-weight: 500;
        }

        /* 文字两侧的发光线条 */
        .glass-divider-with-text::before,
        .glass-divider-with-text::after {
            content: "";
            flex: 1;
            height: 1.5px;
            background: linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0),
                    rgba(255, 255, 255, 0.5)
            );
        }

        .glass-divider-with-text::after {
            background: linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.5),
                    rgba(255, 255, 255, 0)
            );
        }

        /* 中间文字卡片 */
        .divider-text-content {
            padding: 4px 14px;
            margin: 0 12px;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            letter-spacing: 0.5px;
        }

        /* 3. 垂直分割线 */
        .vertical-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .glass-divider-vertical {
            width: 1.5px;
            height: 18px;
            display: inline-block;
            background: linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.1) 0%,
                    #60a5fa 50%,
                    rgba(255, 255, 255, 0.1) 100%
            );
            box-shadow: 0 0 6px rgba(96, 165, 250, 0.5);
        }

        .action-link {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }
        .action-link:hover {
            color: #60a5fa;
        }
    </style>
</head>
<body>

<div class="glass-panel">
    <p class="panel-text">上方内容区域，用于展示常规文本或卡片元素。</p>

    <!-- 1. 基础高光渐变分割线 -->
    <hr class="glass-divider">

    <p class="panel-text">下方内容区域，展示基础渐变发光分割线效果。</p>

    <!-- 2. 带文字的分割线 -->
    <div class="glass-divider-with-text">
        <span class="divider-text-content">或通过以下方式登录</span>
    </div>

    <!-- 3. 垂直分割线应用示例 -->
    <div class="vertical-container">
        <a href="#" class="action-link">忘记密码</a>
        <span class="glass-divider-vertical"></span>
        <a href="#" class="action-link">注册新账号</a>
        <span class="glass-divider-vertical"></span>
        <a href="#" class="action-link">帮助中心</a>
    </div>
</div>

</body>
</html>
